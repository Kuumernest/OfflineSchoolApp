# .github/workflows/release.yml — installable builds for a version tag.
#
# Push a tag vX.Y.Z (matching mobile/app.json "version") and this builds:
#   - the Android APK, through EAS Build (profile production-apk), for direct
#     distribution to schools;
#   - the Windows desktop installer and portable .exe, ONLY when the
#     repository variable DESKTOP_RELEASE_ENABLED is "true";
# and attaches them, with SHA256SUMS, to a GitHub PRE-RELEASE for testers.
# A pre-release is published (downloadable by anyone who can see the repo)
# but never marked "Latest". Nothing here deploys the server, publishes to a
# store, or turns on auto-update.
#
# Configuration (Settings → Secrets and variables → Actions):
#   secret   EXPO_TOKEN               an Expo access token (robot user) for EAS Build
#   variable PRODUCTION_API_URL       https://<api-domain>/api — baked into the APK
#   variable DESKTOP_RELEASE_ENABLED  "true" to build desktop installers
#   variable DESKTOP_API_URL          https://<api-domain>/api — the server an installer
#                                     starts with (the user can change it on first run)
# A missing one fails the run at the start, by name.
#
# Third-party actions are pinned to the commit of a reviewed release tag.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"

jobs:
  preflight:
    name: Check the tag and configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.config.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: version
        name: The tag matches the mobile app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z"; exit 1
          fi
          mobile=$(node -p 'require("./OfflineSchoolApp/mobile/app.json").expo.version')
          if [[ "$mobile" != "$version" ]]; then
            echo "::error::Tag $TAG but mobile/app.json version is $mobile — bump it, commit, and tag that commit"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: config
        name: Required configuration is present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          DESKTOP_RELEASE_ENABLED: ${{ vars.DESKTOP_RELEASE_ENABLED }}
          DESKTOP_API_URL: ${{ vars.DESKTOP_API_URL }}
        run: |
          ok=1
          check_url() {   # name value
            if ! [[ "$2" =~ ^https://[^/]+/api$ ]] || [[ "$2" == *REPLACE* ]]; then
              echo "::error::$1 must be https://<api-domain>/api (got '${2:-unset}')"; ok=0
            fi
          }
          [[ -n "$EXPO_TOKEN" ]] || { echo "::error::Secret EXPO_TOKEN is not set"; ok=0; }
          check_url PRODUCTION_API_URL "$PRODUCTION_API_URL"
          if [[ "$DESKTOP_RELEASE_ENABLED" == "true" ]]; then
            check_url DESKTOP_API_URL "$DESKTOP_API_URL"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Desktop installers skipped (DESKTOP_RELEASE_ENABLED is not \"true\")"
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi
          [[ "$ok" == 1 ]]

  android:
    name: Android APK (EAS Build)
    needs: preflight
    # x64 Linux: EAS builds in its own cloud; this runner only submits and waits.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: OfflineSchoolApp/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: OfflineSchoolApp/mobile/package-lock.json
      - run: npm ci

      # The API URL is inlined into the bundle at build time. eas.json carries a
      # placeholder; this run's copy gets the real one from the repository
      # variable, for the profiles the APK build reads.
      - name: Set the production API URL for this build
        run: |
          node -e '
            const fs = require("fs");
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            for (const p of ["production", "production-apk"]) {
              eas.build[p].env = { ...(eas.build[p].env || {}), EXPO_PUBLIC_API_URL: process.env.PRODUCTION_API_URL };
            }
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));'

      # Signing: the Android keystore is held by EAS (eas credentials). It is
      # never in this repository or this runner's logs. Back it up as docs/17
      # describes — losing it means installed apps can never be updated.
      - name: Build the APK on EAS and wait
        run: npx --yes eas-cli@24.8.0 build --platform android --profile production-apk --non-interactive --wait --json > ../eas-build.json

      - name: Download the APK
        run: |
          url=$(node -p 'const b = require("../eas-build.json"); (Array.isArray(b) ? b[0] : b).artifacts.buildUrl')
          case "$url" in https://*) ;; *) echo "::error::EAS returned no build URL"; exit 1;; esac
          mkdir -p ../release
          curl -fsSL --retry 3 -o "../release/MySchoolOnTheMove-${VERSION}-android.apk" "$url"
          test -s "../release/MySchoolOnTheMove-${VERSION}-android.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: OfflineSchoolApp/release/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop (Windows)
    needs: preflight
    if: needs.preflight.outputs.desktop == 'true'
    # Windows only for now. electron-builder.yml still describes the Linux and
    # macOS targets; add their runners back here to build them.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DESKTOP_API_URL: ${{ vars.DESKTOP_API_URL }}
      # No certificates are configured: build unsigned, and say so (docs/17).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          npm ci --prefix OfflineSchoolApp/web
          npm ci --prefix OfflineSchoolApp/desktop
      - name: Stamp the version and the default server
        working-directory: OfflineSchoolApp/desktop
        # The web build keeps its relative /api base: the desktop serves it
        # over app://school/ and relays /api to the server itself
        # (src/main/appProtocol.js). The server an installer starts with goes in
        # package.json config.defaultServerUrl, as an origin (no /api); the
        # school can change it on the first-run screen.
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pkg set "config.defaultServerUrl=${DESKTOP_API_URL%/api}"
      - name: Package (web build, then electron-builder; never publishes)
        working-directory: OfflineSchoolApp/desktop
        run: npm run package -- --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows
          path: OfflineSchoolApp/desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: GitHub pre-release
    needs: [preflight, android, desktop]
    if: always() && needs.android.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --prerelease --latest=false --verify-tag --title "$TAG (testing)" \
            --notes "Test build — not for production use. Android APK built by EAS (production-apk); install it by allowing installs from unknown sources. The Windows installer is UNSIGNED: SmartScreen shows \"Windows protected your PC\" — choose More info → Run anyway (docs/17). Verify downloads against SHA256SUMS."
