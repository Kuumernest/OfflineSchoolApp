# nginx-http.conf — port 80, a template (${DOMAIN}), always served.
#
# The Let's Encrypt challenge, and a redirect to https:// for everything
# else. Rendered by nginx-start.sh, which adds nginx.conf (port 443) once
# the certificate exists, so a fresh server starts here and can be issued
# its first certificate through the webroot (docs/17, TLS).

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    server_tokens off;

    # The HTTP-01 challenge, written by certbot's webroot plugin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
