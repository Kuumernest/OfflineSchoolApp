# nginx.conf — HTTPS on port 443, a template (${DOMAIN}).
#
# Rendered by nginx-start.sh only once /etc/letsencrypt/live/${DOMAIN}/
# holds the certificate; port 80 (nginx-http.conf) is served from the start.
# Only ${DOMAIN} is substituted: nginx's own variables ($host, $uri …) are
# left alone. HTTPS only (docs/40 0.7); the certificate is issued and
# renewed by the `certbot` service (docker-compose.yml).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No nginx version in error pages or the Server header.
    server_tokens off;

    # Browsers keep to HTTPS for a year once they have seen this. The backend
    # (helmet) sends its own HSTS on every response, so the proxied locations
    # below hide that one: one header, this one, not two that disagree.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The same values helmet sends; the proxied locations hide helmet's copies
    # so every response, nginx's own 404s included, carries exactly one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── Nothing else lives here ──────────────────────────────────────────────
    #
    # This host is the API. The web console is served by Cloudflare Pages
    # (docs/17), with its own SPA routing; serving a copy here too would be a
    # second, older console one stale build away. Everything outside /api/ and
    # /uploads/ is a plain 404.
    location / {
        return 404;
    }

    # Development-only routes (server.js registers /api/debug/* only outside
    # production) and an admin count no client calls: closed at the door too,
    # so a misconfigured NODE_ENV does not open them.
    location /api/debug/ {
        return 404;
    }
    location /api/admin/debug/ {
        return 404;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One copy of each header, nginx's (see the server block).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Upload limit: the largest multer limit in the backend (teacher
        # content, 500 MB, routes/teacher.routes.js).
        client_max_body_size 500m;

        # The backend allows a request 10 minutes (server.timeout in
        # server.js): a 500 MB upload on a school's connection, a whole-class
        # report-card export. nginx's own 60s default cut those off with a 504
        # while the backend was still working.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        client_body_timeout   120s;
    }

    # ── Uploaded files ────────────────────────────────────────────────────────
    #
    # Proxied, not served from disk. These are pupils' photographs, guardian
    # correspondence and scanned admission documents; `alias /uploads/` handed
    # every one of them to anyone who could name the path, with no token and no
    # log. The backend has a signature gate on this exact route — going through
    # it is the only way that gate is ever consulted.
    #
    # Safe to switch before enforcement is turned on: the gate defaults to
    # observe mode, so unsigned requests are logged and still answered. Set
    # REQUIRE_MEDIA_SIGNATURE=1 once clients have had one signature lifetime
    # (7 days) to pick up signed URLs.
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One copy of each header, nginx's (see the server block).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Range requests matter here: the content library serves video and
        # audio, and a player needs to seek without refetching the file.
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # No `expires`/`immutable` any more. A cached response is one the gate
        # never sees again, and a signed URL that outlives its signature in a
        # shared cache is the thing signing exists to prevent. The backend sets
        # its own caching headers per file.
        proxy_buffering off;
    }
}
