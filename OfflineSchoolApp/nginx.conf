server {
    listen 80;
    server_name _;

    # ── Web app (static files) ────────────────────────────────────────────────
    location / {
        root /app/public/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload limit (matches backend multer)
        client_max_body_size 500m;
    }

    # ── Uploaded files ────────────────────────────────────────────────────────
    #
    # Proxied, not served from disk. These are pupils' photographs, guardian
    # correspondence and scanned admission documents; `alias /uploads/` handed
    # every one of them to anyone who could name the path, with no token and no
    # log. The backend has a signature gate on this exact route — going through
    # it is the only way that gate is ever consulted.
    #
    # Safe to switch before enforcement is turned on: the gate defaults to
    # observe mode, so unsigned requests are logged and still answered. Set
    # REQUIRE_MEDIA_SIGNATURE=1 once clients have had one signature lifetime
    # (7 days) to pick up signed URLs.
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range requests matter here: the content library serves video and
        # audio, and a player needs to seek without refetching the file.
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # No `expires`/`immutable` any more. A cached response is one the gate
        # never sees again, and a signed URL that outlives its signature in a
        # shared cache is the thing signing exists to prevent. The backend sets
        # its own caching headers per file.
        proxy_buffering off;
    }
}
