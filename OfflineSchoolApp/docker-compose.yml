# docker-compose.yml — the production stack on one VM (docs/17).
#
#   backend   the Express API, built from ./Dockerfile (target `production`)
#   nginx     the only public door: 80 (ACME challenge + redirect) and 443
#   certbot   renews the Let's Encrypt certificate twice a day
#
# The database is MongoDB Atlas, outside this stack: there is no mongo service.
# The web console is served by Cloudflare Pages, not by this stack: nginx
# proxies /api/ and /uploads/ and answers 404 for everything else.
#
# Configuration comes from two places, neither of them in git:
#   - the backend's environment file, BACKEND_ENV_FILE (default
#     ./deploy/backend.env, from deploy/backend.env.example; chmod 600) —
#     MONGODB_URI, JWT secrets, ALLOWED_ORIGINS, Brevo, Sentry, Anthropic …
#     The backend refuses to start without the required ones (src/config/env.js).
#   - the shell or ./.env next to this file, for compose itself: DOMAIN.

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: offlineschool-backend:${APP_VERSION:-local}
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM to node and reaps the analysis workers
    # (src/services/intelligence) if one is ever orphaned.
    init: true
    # server.js closes HTTP, then MongoDB, and forces an exit after 10s; give
    # it that and a margin before Docker sends SIGKILL.
    stop_grace_period: 20s
    # Docker's json-file logs, capped: 5 files of 10 MB per service, so the
    # logs cannot fill the disk (docs/40 0.9).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - ${BACKEND_ENV_FILE:-./deploy/backend.env}
    environment:
      # Fixed for this stack, whatever the env file says.
      NODE_ENV: production
      PORT: 5000
      # Cameroon time (UTC+1) for printed dates and logs (docs/40 0.11).
      TZ: Africa/Douala
    # No host port, on purpose (docs/40 0.7): only nginx reaches the backend,
    # over the Docker network, and nginx is the one door, on 80 and 443.
    # For a look from the server itself:
    #   docker compose exec backend wget -qO- http://127.0.0.1:5000/api/health/ready
    expose:
      - "5000"
    volumes:
      # /app/src/uploads, because that is where the application reads and
      # writes — see the note in the Dockerfile. The only state on this VM.
      - uploads_data:/app/src/uploads
    # Readiness: the database answers a ping (/api/health/ready). Compose does
    # not restart an unhealthy container, so an Atlas outage shows as
    # "unhealthy" in `docker compose ps` instead of a restart loop. A crashed
    # process is restarted by `restart:` above.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ── Nginx (reverse proxy, TLS) ───────────────────────────────────────────────
  nginx:
    # Plain nginx: the configuration is mounted, and there is no web build to
    # bake in any more. Multi-arch, so it runs on ARM64 as it is.
    image: nginx:stable-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Started, not healthy: nginx must come up to answer the ACME challenge
    # even while the backend waits for Atlas.
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The public name the certificate is for, e.g. api.example.cm.
      DOMAIN: ${DOMAIN:?DOMAIN must be set — the name the TLS certificate is issued for}
      TZ: Africa/Douala
    # Port 80 at once; 443 as soon as the certificate exists; a reload every
    # 6 hours for a renewed one (nginx-start.sh).
    command: ["/bin/sh", "/nginx-start.sh"]
    volumes:
      - ./nginx-start.sh:/nginx-start.sh:ro
      - ./nginx-http.conf:/etc/nginx/site/http.conf.template:ro
      - ./nginx.conf:/etc/nginx/site/https.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      # The uploads volume is deliberately NOT mounted here. nginx proxies
      # /uploads/ to the backend so the signature gate is consulted; giving
      # nginx the files as well would leave a second, ungated way to reach
      # them one edited location block away.

  # ── Certbot (TLS certificate renewal) ──────────────────────────────────────
  # Renews the Let's Encrypt certificate through nginx's port 80 (webroot).
  # The first certificate is issued once by hand, through the same webroot,
  # with nginx already running (docs/17, TLS); after that this checks twice a
  # day and renews when due.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  uploads_data:
  letsencrypt:
  certbot_webroot:
