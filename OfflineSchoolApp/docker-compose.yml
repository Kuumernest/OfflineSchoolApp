version: "3.9"

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      # Required with no default: a database reachable with a guessed password
      # is not a default, it is an outage waiting for a port scan. Put real
      # values in the deployment environment, never in git.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set}
    # No host port mapping, on purpose. Only the backend reaches Mongo, over
    # the Docker network; publishing 27017 to the host invites the internet
    # to try the password.
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER must be set}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set}@mongo:27017/school_app?authSource=admin
      # Required with no default — src/config/env.js refuses a short or
      # placeholder secret at boot, so the container starts only once a real
      # one (32+ characters) is in the environment.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (32+ characters)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_EXPIRES_IN: 30d
      JWT_REFRESH_EXPIRES: 90d
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set — it is the CORS allow-list}
    # No host port, on purpose (docs/40 0.7): only nginx reaches the backend,
    # over the Docker network, and nginx is the one door, on 80 and 443.
    # Publishing 5000 let anyone skip TLS and nginx altogether. For a look
    # from the server itself, `docker compose exec backend wget -qO- http://localhost:5000/api/health`.
    expose:
      - "5000"
    volumes:
      # /app/src/uploads, because that is where the application reads and
      # writes — see the note in the Dockerfile. Mounted at /app/uploads
      # this volume stayed empty and uploads did not survive a restart.
      - uploads_data:/app/src/uploads

  # ── Nginx (reverse proxy) ────────────────────────────────────────────────────
  nginx:
    # nginx:alpine with the web build at /app/public/web, where nginx.conf
    # serves it from (Dockerfile, target `web`).
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The public name the certificate is for, e.g. ecole.example.cm.
      DOMAIN: ${DOMAIN:?DOMAIN must be set — the name the TLS certificate is issued for}
    # Reload every 6 hours so a certificate certbot has renewed is picked up.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    volumes:
      # A template: the image renders it to conf.d/default.conf with ${DOMAIN}.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      # The uploads volume is deliberately NOT mounted here any more. nginx
      # proxies /uploads/ to the backend so the signature gate is consulted;
      # giving nginx the files as well would leave a second, ungated way to
      # reach them one edited location block away.

  # ── Certbot (TLS certificate renewal) ──────────────────────────────────────
  # Renews the Let's Encrypt certificate through nginx's port 80 (webroot).
  # The first certificate is issued once by hand before nginx starts
  # (docs/17, TLS); after that this checks twice a day and renews when due.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  mongo_data:
  uploads_data:
  letsencrypt:
  certbot_webroot:
