version: "3.9"

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      # Required with no default: a database reachable with a guessed password
      # is not a default, it is an outage waiting for a port scan. Put real
      # values in the deployment environment, never in git.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set}
    # No host port mapping, on purpose. Only the backend reaches Mongo, over
    # the Docker network; publishing 27017 to the host invites the internet
    # to try the password.
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER must be set}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set}@mongo:27017/school_app?authSource=admin
      # Required with no default — src/config/env.js refuses a short or
      # placeholder secret at boot, so the container starts only once a real
      # one (32+ characters) is in the environment.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (32+ characters)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_EXPIRES_IN: 30d
      JWT_REFRESH_EXPIRES: 90d
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set — it is the CORS allow-list}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  # ── Nginx (reverse proxy) ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/uploads:ro

volumes:
  mongo_data:
  uploads_data:
